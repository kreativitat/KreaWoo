name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan all reachable history before publication
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVENT_NAME: ${{ github.event_name }}
      FULL_HISTORY: ${{ inputs.full_history }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified secret scanner
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          scanner_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$scanner_archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner_archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$scanner_archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          printf '%s\n' "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan source and compressed release archives
        shell: bash
        run: |
          set -euo pipefail
          gitleaks dir . --config=.gitleaks.toml --redact=100 --no-banner \
            --ignore-gitleaks-allow --max-archive-depth=3 --max-decode-depth=3

      - name: Scan new commits or requested publication history
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FULL_HISTORY" == "true" ]]; then
            revision_range="--all"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            exit 0
          elif [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]]; then
            revision_range="$BASE_SHA..$HEAD_SHA"
          else
            revision_range="--all"
          fi
          python3 scripts/check_publication.py --range="$revision_range"
          gitleaks git . --config=.gitleaks.toml --log-opts="--full-history -m $revision_range" \
            --redact=100 --no-banner --ignore-gitleaks-allow \
            --max-archive-depth=3 --max-decode-depth=3

      - name: Verify publication guard regressions
        run: python3 -m unittest discover -s tests -p 'test_publication_guard.py'
